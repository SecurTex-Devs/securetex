packages:
  - "apps/*"

# Parches transitivos de los avisos registrados en la revisión de dependencias.
# Fastify también llega fijado por @nestjs/platform-fastify.
overrides:
  "fastify@<5.12.8": "5.12.8"
  "deepmerge-ts@<8": "8.0.2"
  "effect@>=3 <3.22.1": "3.22.5"
  "glob@>=13 <14": "14.0.6"
  "js-yaml@>=5 <5.4.1": "5.5.0"
  "fast-uri@>=3 <3.1.9": "3.1.9"
  "fast-uri@>=4 <4.2.3": "4.2.4"

# Solo estos paquetes pueden ejecutar scripts de instalación (AGENTS.md §8:
# scripts de post-instalación no auditados prohibidos).
allowBuilds:
  "@nestjs/core": true
  "@prisma/client": true
  "@prisma/engines": true
  "argon2": true
  "prisma": true
  "esbuild": true
  "@scarf/scarf": false

minimumReleaseAgeExclude:
  - fast-uri@4.2.4
