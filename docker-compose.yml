# SecurTex · todo el sistema: base de datos, API, sandbox de LaTeX, web y correo
#
#   cp .env.example .env        # rellena los secretos (cada uno trae su comando)
#   docker compose up --build -d
#
# | Servicio  | URL                              | Para qué                          |
# |-----------|----------------------------------|-----------------------------------|
# | web       | http://localhost:3000            | La aplicación                     |
# | api       | http://localhost:4000/api/docs   | Swagger (solo en desarrollo)      |
# | mailpit   | http://localhost:8025            | Bandeja de los correos enviados   |
#
# Los puertos internos (PostgreSQL) no se publican. Los publicados se atan a
# 127.0.0.1 salvo que PUBLISH_HOST diga otra cosa.

name: securtex

x-api-env: &api-env
  NODE_ENV: development
  PORT: "4000"
  # Varios orígenes separados por comas; el primero es el de los enlaces de los correos.
  # Red local: APP_ORIGIN=http://<IP-del-equipo>:3000,http://localhost:3000 y PUBLISH_HOST=0.0.0.0
  APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
  # La API solo confía en X-Forwarded-For si viene de la red interna (el proxy de Next).
  TRUST_PROXY: loopback,uniquelocal
  DATABASE_URL_IDENTITY: postgresql://securtex_identity:${DB_IDENTITY_PASSWORD:?falta en .env (copia .env.example a .env y rellénalo)}@postgres:5432/securtex
  DATABASE_URL_APP: postgresql://securtex_app:${DB_APP_PASSWORD:?}@postgres:5432/securtex
  DATABASE_URL_AUDIT: postgresql://securtex_audit:${DB_AUDIT_PASSWORD:?}@postgres:5432/securtex
  JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?}
  MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?}
  FILES_MASTER_KEY: ${FILES_MASTER_KEY:?falta en .env (copia .env.example a .env y rellénalo)}
  TRANSPORT_PRIVATE_KEY: ${TRANSPORT_PRIVATE_KEY:?falta en .env (copia .env.example a .env y rellénalo)}
  DATA_MASTER_KEY: ${DATA_MASTER_KEY:?falta en .env (copia .env.example a .env y rellénalo)}
  COMPILER_SIGNING_KEY: ${COMPILER_SIGNING_KEY:?falta en .env (copia .env.example a .env y rellénalo)}
  COMPILE_JOBS_DIR: /jobs
  COMPILE_TIMEOUT_MS: &compile-timeout "30000"
  COOKIE_SECURE: "false"
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  HIBP_ENABLED: ${HIBP_ENABLED:-true}
  API_DOCS_ENABLED: "true"
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
  MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
  MICROSOFT_TENANT: ${MICROSOFT_TENANT:-consumers}

services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: securtex_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: securtex
      DB_IDENTITY_PASSWORD: ${DB_IDENTITY_PASSWORD:?}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?}
      DB_AUDIT_PASSWORD: ${DB_AUDIT_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/01-roles.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securtex_owner -d securtex"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

  # Migraciones y datos de demostración. Es el ÚNICO servicio con las
  # credenciales del propietario de la base de datos; la API nunca las tiene.
  migrate:
    build:
      context: ./backend
      dockerfile: apps/api/Dockerfile
    image: securtex-api:local
    environment:
      <<: *api-env
      DATABASE_URL: postgresql://securtex_owner:${POSTGRES_PASSWORD:?}@postgres:5432/securtex
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-}
    command: ["sh", "-c", "pnpm exec prisma migrate deploy && node dist/scripts/seed.js"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Sandbox de compilación (Zona 4): ejecuta LaTeX, es decir, código hostil.
  # Sin interfaz de red (ni Internet, ni la API, ni PostgreSQL): recibe los
  # trabajos por el volumen tmpfs compile-jobs. Raíz de solo lectura, sin
  # capacidades, sin escalada, usuario 1000, límites de CPU, memoria y PID.
  # gVisor (runsc) no está en Docker Desktop; donde exista, COMPILER_RUNTIME=runsc.
  compiler:
    build:
      context: ./backend
      dockerfile: apps/compiler/Dockerfile
    image: securtex-compiler:local
    runtime: ${COMPILER_RUNTIME:-runc}
    network_mode: none
    user: "1000:1000"
    environment:
      JOBS_DIR: /jobs
      WORK_DIR: /work
      COMPILE_TIMEOUT_MS: *compile-timeout
      COMPILE_MAX_PDF_BYTES: "16777216"
      COMPILE_CONCURRENCY: "2"
    volumes:
      - compile-jobs:/jobs
    read_only: true
    tmpfs:
      # Directorio efímero de cada trabajo: privado de este contenedor, sin ejecución.
      - /work:size=256m,mode=0700,uid=1000,gid=1000,noexec,nosuid,nodev
      - /tmp:size=8m,mode=1777,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    pids_limit: 64
    mem_limit: 1536m
    memswap_limit: 1536m
    cpus: 2
    ulimits:
      core: 0
      nofile: { soft: 1024, hard: 1024 }
    restart: unless-stopped

  api:
    image: securtex-api:local
    environment: *api-env
    volumes:
      - compile-jobs:/jobs
    ports:
      # La API y su WebSocket de colaboración. PUBLISH_HOST=0.0.0.0 la expone a la red local.
      - "${PUBLISH_HOST:-127.0.0.1}:4000:4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
      compiler:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: unless-stopped

  web:
    build:
      context: ./frontend
    environment:
      API_INTERNAL_URL: http://api:4000
      COLLAB_PUBLIC_PORT: "4000"
    ports:
      - "${PUBLISH_HOST:-127.0.0.1}:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: unless-stopped

volumes:
  pgdata:
  # Buzón API ↔ sandbox. tmpfs: el texto descifrado de los proyectos nunca toca disco.
  compile-jobs:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=128m,uid=1000,gid=1000,mode=0700,noexec,nosuid,nodev
