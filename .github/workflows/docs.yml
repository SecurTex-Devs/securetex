name: Documentación

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Denegar por defecto; cada job amplía lo mínimo necesario
permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Verificar documentación
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detección de secretos
        uses: gitleaks/gitleaks-action@83373cf2f8c4db6e24b41c1a9b086bb9619e9cd3 # v2.3.7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Construir el sitio (modo estricto — falla ante enlaces rotos)
        run: mkdocs build --strict

      - name: Validar los diagramas Mermaid
        run: |
          npm install -g @mermaid-js/mermaid-cli
          bash scripts/validar-mermaid.sh

      - name: Comprobar enlaces externos
        uses: lycheeverse/lychee-action@f613c4a64e50d792e0b31ec34bbcbba12263c6a6 # v2.3.0
        with:
          args: --no-progress --exclude-mail --accept 200,206,429 './docs/**/*.md' 'README.md'
          fail: false

      - name: Subir el sitio como artefacto
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ./site

  publicar:
    name: Publicar en GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: verificar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
